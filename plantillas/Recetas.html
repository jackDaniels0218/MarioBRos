{% extends 'base.html' %}{% block title %}Recetas{% endblock %}{% block content %}<h1>Recetas</h1><section class="card"><form method="post">{% csrf_token %}<select name="plato">{% for item in platos %}<option value="{{ item.id }}">{{ item.nombre_plato }}</option>{% endfor %}</select><select name="insumo">{% for item in lotes %}<option value="{{ item.id }}">{{ item.codigo_referencia }} - {{ item.nombre_insumo }}</option>{% endfor %}</select><input name="cantidad" type="number" step="0.01" min="0.01" required placeholder="Cantidad"><button class="button primary">Guardar relacion</button></form></section><section class="card"><table><tr><th>Plato</th><th>Insumo</th><th>Cantidad</th></tr>{% for item in recetas %}<tr><td>{{ item.plato.nombre_plato }}</td><td>{{ item.insumo.nombre_insumo }}</td><td>{{ item.cantidad_requerida }}</td></tr>{% endfor %}</table></section>{% endblock %}
