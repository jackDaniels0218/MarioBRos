{% extends 'base.html' %}{% block title %}Platos{% endblock %}{% block content %}<h1>Platos</h1><section class="card"><form method="post">{% csrf_token %}<input type="hidden" name="accion" value="crear"><input name="nombre" placeholder="Nombre" required><input name="precio" type="number" step="0.01" min="0" placeholder="Precio" required><select name="categoria">{% for item in categorias %}<option>{{ item }}</option>{% endfor %}</select><button class="button primary">Crear plato</button></form></section><section class="card"><table><tr><th>Nombre</th><th>Precio</th><th>Categoria</th><th>Estado</th></tr>{% for item in platos %}<tr><td>{{ item.nombre_plato }}</td><td>${{ item.precio_venta }}</td><td>{{ item.categoria }}</td><td>{{ item.estado|yesno:'Activo,Inactivo' }}</td></tr>{% endfor %}</table></section>{% endblock %}
