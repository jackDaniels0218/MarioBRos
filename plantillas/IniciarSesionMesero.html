<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iniciar sesión | Mesero</title>
	<style>
		:root {
			--principal: #F75E54;
			--fondo: #fff7f6;
			--texto: #2d2d2d;
			--borde: #dddddd;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: var(--fondo);
			color: var(--texto);
			font-family: Arial, sans-serif;
		}

		.navegacion {
			position: fixed;
			top: 20px;
			right: 24px;
		}

		.navegacion a {
			padding: 10px 14px;
			border: 1px solid var(--principal);
			border-radius: 4px;
			color: var(--principal);
			font-size: 14px;
			font-weight: bold;
			text-decoration: none;
		}

		.navegacion a:hover {
			background: var(--principal);
			color: #ffffff;
		}

		.login {
			width: 100%;
			max-width: 380px;
			padding: 32px;
			background: #ffffff;
			border-top: 5px solid var(--principal);
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
		}

		h1 {
			margin: 0 0 8px;
			font-size: 28px;
		}

		.subtitulo {
			margin: 0 0 24px;
			color: #666666;
		}

		label {
			display: block;
			margin: 16px 0 6px;
			font-weight: bold;
		}

		input {
			width: 100%;
			padding: 12px;
			border: 1px solid var(--borde);
			border-radius: 4px;
			font-size: 16px;
		}

		input:focus {
			outline: 2px solid var(--principal);
			border-color: var(--principal);
		}

		button {
			width: 100%;
			margin-top: 24px;
			padding: 12px;
			border: 0;
			border-radius: 4px;
			background: var(--principal);
			color: #ffffff;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
		}

		button:hover {
			background: #dc4e46;
		}
	</style>
</head>
<body>
	<nav class="navegacion" aria-label="Cambiar tipo de acceso">
		<a href="IniciarSesionAdmin.html">Ir a administrador</a>
	</nav>

	<main class="login">
		<h1>Iniciar sesión</h1>
		<p class="subtitulo">Acceso para mesero</p>

		<form method="post">
			
			<label for="usuario">Usuario</label>
			<input type="text" id="usuario" name="usuario" autocomplete="username" required>

			<label for="password">Contraseña</label>
			<input type="password" id="password" name="password" autocomplete="current-password" required>

			<button type="submit">Ingresar</button>
		</form>
	</main>
</body>
</html>
