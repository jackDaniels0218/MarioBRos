<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cajero</title>
    <style>
        :root {
            --principal: #F75E54;
            --fondo: #f7f4f2;
            --panel: #ffffff;
            --texto: #2d2d2d;
            --muted: #6e6e6e;
            --borde: #eaded9;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--fondo);
            color: var(--texto);
        }
        .layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #f2efee;
            border-right: 1px solid var(--borde);
            padding: 18px 14px;
        }
        .brand {
            font-weight: 700;
            margin-bottom: 24px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            color: #333;
            text-decoration: none;
        }
        .nav-item.active {
            background: rgba(247, 94, 84, 0.08);
            color: var(--principal);
            border: 1px solid rgba(247, 94, 84, 0.15);
            font-weight: 700;
        }
        .content {
            flex: 1;
            padding: 30px 32px;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.03);
        }
        h1 { margin-top: 0; }
        p { color: var(--muted); }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">Sazón</div>
            <nav>
                <a class="nav-item" href="{% url 'vista_admin' %}">◫ Inventario</a>
                <a class="nav-item" href="{% url 'vista_menu' %}">☰ Menú</a>
                <a class="nav-item" href="{% url 'vista_mesero' %}">☷ Comandas</a>
                <a class="nav-item active" href="{% url 'vista_facturacion' %}">▣ Facturación</a>
                <a class="nav-item" href="{% url 'inicio' %}">↩ Volver a inicio</a>
            </nav>
        </aside>
        <main class="content">
            <div class="card">
                <h1>Cajero</h1>
                <p>Panel funcional para facturación y cierre de ventas.</p>
            </div>
        </main>
    </div>
</body>
</html>
