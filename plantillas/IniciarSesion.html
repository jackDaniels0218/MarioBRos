<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <style>
        :root {
            --principal: #F75E54;
            --fondo: #fff7f6;
            --texto: #2d2d2d;
            --borde: #dddddd;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--fondo);
            color: var(--texto);
            font-family: Arial, sans-serif;
        }

        .login {
            width: 100%;
            max-width: 380px;
            padding: 32px;
            background: #ffffff;
            border-top: 5px solid var(--principal);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 { margin: 0 0 8px; font-size: 28px; }
        .subtitulo { margin: 0 0 24px; color: #666666; }
        label { display: block; margin: 16px 0 6px; font-weight: bold; }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--borde);
            border-radius: 4px;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: 2px solid var(--principal);
            border-color: var(--principal);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: 0;
            border-radius: 4px;
            background: var(--principal);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #dc4e46; }
        .error { color: #b42318; margin: 0 0 16px; }
    </style>
</head>
<body>
    <main class="login">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Ingresa tus credenciales</p>

        {% if error %}<p class="error">{{ error }}</p>{% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <label for="rol">Ingresar como</label>
            <select id="rol" name="rol" required>
                <option value="">Selecciona un rol</option>
                <option value="admin">Administrador</option>
                <option value="empleado">Mesero</option>
            </select>

            <button type="submit">Ingresar</button>
        </form>
    </main>
</body>
</html>
