<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <style>
        :root {
            --principal: #F75E54;
            --fondo: #fff7f6;
            --texto: #2d2d2d;
            --borde: #dddddd;
            --gris: #6b7280;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--fondo);
            color: var(--texto);
            font-family: Arial, sans-serif;
        }

        .login {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #ffffff;
            border-top: 5px solid var(--principal);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border-radius: 10px;
        }

        h1 { margin: 0 0 8px; font-size: 28px; }
        .subtitulo { margin: 0 0 18px; color: #666666; }
        .rol-tag {
            display: inline-block;
            margin-bottom: 16px;
            background: #fff1ef;
            color: var(--principal);
            border: 1px solid #ffd3ce;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        label { display: block; margin: 16px 0 6px; font-weight: bold; }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--borde);
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: 2px solid var(--principal);
            border-color: var(--principal);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: var(--principal);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #dc4e46; }
        .error { color: #b42318; margin: 0 0 16px; font-weight: bold; }
        .volver {
            display: inline-block;
            margin-top: 16px;
            color: var(--gris);
            text-decoration: none;
            font-size: 14px;
        }
        .volver:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="login">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Acceso para {{ titulo_rol }}</p>
        <span class="rol-tag">{{ rol }}</span>

        {% if error %}<p class="error">{{ error }}</p>{% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="rol" value="{{ rol }}">

            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit">Ingresar</button>
        </form>

        <a class="volver" href="{% url 'inicio' %}">← Volver al inicio</a>
    </main>
</body>
</html>
