<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <style>
        :root {
            --principal: #F75E54;
            --principal-oscuro: #de5249;
            --fondo: #fff7f6;
            --texto: #2d2d2d;
            --muted: #666666;
            --borde: #f1d9d7;
            --blanco: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #fff6f5 0%, #fefefe 100%);
            font-family: Arial, sans-serif;
            color: var(--texto);
        }

        .card {
            width: min(820px, 90vw);
            background: var(--blanco);
            border: 1px solid var(--borde);
            border-radius: 18px;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.06);
            padding: 42px 36px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 4vw, 42px);
            text-align: center;
            color: var(--texto);
        }

        .subtitulo {
            margin: 0 0 32px;
            text-align: center;
            color: var(--muted);
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(180px, 1fr));
            gap: 22px;
        }

        .option {
            display: block;
            text-decoration: none;
            color: inherit;
            border: 1px solid #f1d2cf;
            border-radius: 18px;
            padding: 30px 18px;
            background: linear-gradient(180deg, #fffdfd 0%, #fff5f4 100%);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            text-align: center;
        }

        .option:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(247, 94, 84, 0.09);
            border-color: var(--principal);
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: var(--principal);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 28px;
            font-weight: bold;
        }

        .option h2 {
            margin: 0 0 8px;
            font-size: 22px;
            color: var(--texto);
        }

        .option p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>MarioBRos</h1>
        <p class="subtitulo">Selecciona el acceso que deseas</p>

        <div class="grid">
            <a class="option" href="{% url 'iniciar_sesion_rol' 'admin' %}">
                <div class="icon">A</div>
                <h2>Administrador</h2>
                <p>Gestión de inventario, menús y control del sistema.</p>
            </a>

            <a class="option" href="{% url 'iniciar_sesion_rol' 'mesero' %}">
                <div class="icon">M</div>
                <h2>Mesero</h2>
                <p>Atención al cliente y registro de comandas.</p>
            </a>

            <a class="option" href="{% url 'iniciar_sesion_rol' 'cajero' %}">
                <div class="icon">C</div>
                <h2>Cajero</h2>
                <p>Facturación y cierre de ventas.</p>
            </a>
        </div>
    </main>
</body>
</html>
